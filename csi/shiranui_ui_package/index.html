<style>
:root{--canvas:#f4f7fa;--surface:#fff;--ink:#182839;--muted:#66788b;--border:#dfe7ee;--brand:#076d77;--brandTint:#e8f5f5;--critical:#c43e38;--criticalTint:#fff0ee;--warning:#a9650a;--warningTint:#fff6e7;--ok:#16734d;--okTint:#ecf8f2;--sidebar:#182630}*{box-sizing:border-box}body{margin:0;background:var(--canvas);font:13px 'Segoe UI','Yu Gothic UI',Meiryo,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #70c1c6;outline-offset:2px}.app{min-height:100vh;display:grid;grid-template-columns:68px minmax(0,1fr)}.rail{background:var(--sidebar);display:flex;align-items:center;flex-direction:column;gap:12px;padding:17px 8px}.logo{width:38px;height:38px;border-radius:12px;background:white;display:grid;place-items:center;margin-bottom:26px;position:relative}.logo::before{content:'';width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#ffae28,#ef6b10);position:absolute;top:7px}.logo::after{content:'';width:16px;height:9px;transform:rotate(180deg);border:4px solid #354550;border-bottom:0;border-radius:12px 12px 0 0;position:absolute;bottom:6px}.nav{width:44px;height:44px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;color:#b8c9d3;position:relative}.nav.active{background:#28515b;color:#fff}.nav.active::before{position:absolute;left:-8px;width:3px;height:28px;background:#43b8b9;content:'';border-radius:5px}.ico{width:18px;height:18px;display:inline-block;vertical-align:middle;filter:none}.nav .ico{filter:brightness(0) invert(.92)}.nav.active .ico{filter:brightness(0) invert(1)}.spacer{flex:1}.main{min-width:0}.top{height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:20px}.heading{display:flex;align-items:center;gap:12px}.heading strong{font-size:18px;letter-spacing:.04em}.heading small{color:var(--muted);font-size:12px}.live{display:inline-flex;align-items:center;gap:7px;border-radius:20px;background:var(--okTint);color:var(--ok);font-weight:700;padding:6px 10px;font-size:11px}.live::before{content:'';width:7px;height:7px;border-radius:50%;background:#24a96a}.topright{display:flex;align-items:center;gap:10px}.muted{color:var(--muted)}.btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:9px 12px;display:inline-flex;gap:7px;align-items:center;justify-content:center;color:var(--ink);white-space:nowrap}.btn.primary{background:var(--brand);color:white;border-color:var(--brand)}.btn.small{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}.content{padding:24px 28px 30px;max-width:2000px;margin:auto}.eyebrow{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}.pagehead h1{font-size:24px;margin:5px 0 0;letter-spacing:-.025em}.head-actions{display:flex;gap:8px;align-items:center}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0 0 20px}.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:17px 18px;min-height:116px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:0 2px 7px #253b4510}.kpi.active{border:2px solid var(--brand);padding:16px 17px;box-shadow:0 0 0 2px #cce9e9}.kpi .label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.kpi .value{font-size:29px;font-weight:750;letter-spacing:-1px;line-height:1}.kpi .unit{font-size:12px;font-weight:400;margin-left:5px;color:var(--muted)}.kpi .hint{color:var(--muted);font-size:11px}.kpi.danger .value{color:var(--critical)}.workarea{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 3px 16px #253b4510}.tabs{height:51px;padding:0 18px;display:flex;align-items:stretch;gap:22px;border-bottom:1px solid var(--border)}.tab{border:0;border-bottom:3px solid transparent;background:none;font-weight:650;color:var(--muted);padding:0 2px}.tab.active{border-color:var(--brand);color:var(--brand)}.filters{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}.searchwrap{position:relative;min-width:230px;flex:1;max-width:360px}.searchwrap .ico{position:absolute;left:11px;top:11px;opacity:.55}.searchwrap input{width:100%;padding:10px 10px 10px 36px;border:1px solid var(--border);border-radius:8px;outline:none;background:#fff}.filters select{border:1px solid var(--border);padding:10px 28px 10px 10px;border-radius:8px;background:#fff;color:var(--ink)}.checklabel{display:flex;align-items:center;gap:5px;color:var(--muted);white-space:nowrap}.checklabel input{accent-color:var(--brand)}.filter-count{margin-left:auto;color:var(--muted);font-size:12px}.split{display:grid;grid-template-columns:minmax(500px, 1.08fr) minmax(390px,.92fr);min-height:610px}.listpane{min-width:0;border-right:1px solid var(--border)}.listhead{padding:14px 17px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border)}.listhead strong{font-size:14px}.table-scroll{overflow:auto;max-height:560px}table{width:100%;border-collapse:collapse;font-size:12px}thead{background:#f8fafc;position:sticky;top:0;z-index:1}th{text-align:left;color:#687b8a;font-weight:650;font-size:11px;padding:12px 10px;white-space:nowrap;border-bottom:1px solid var(--border)}td{padding:12px 10px;border-bottom:1px solid #edf1f4;white-space:nowrap}tr.item{cursor:pointer}tr.item:hover{background:#f7fafb}tr.selected{background:#eaf6f6}tr.selected:hover{background:#e5f3f3}td:first-child,th:first-child{padding-left:18px}.proc{font-weight:650;color:#213447}.badge{display:inline-flex;align-items:center;border-radius:20px;padding:3px 8px;font-weight:700;font-size:11px}.badge.high{background:var(--criticalTint);color:var(--critical)}.badge.med{background:var(--warningTint);color:var(--warning)}.badge.low{background:#edf3f8;color:#516f82}.badge.pending{background:#eef2f6;color:#556678}.badge.done{background:var(--okTint);color:var(--ok)}.detail{min-width:0;padding:21px 22px 26px;background:#fff}.detailtop{display:flex;align-items:start;justify-content:space-between;gap:10px}.detail h2{font-size:21px;margin:2px 0 8px}.detail h3{font-size:13px;margin:22px 0 10px}.detailactions{display:flex;gap:7px}.detailmeta{color:var(--muted);font-size:12px;margin-top:7px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.notice{background:#f2f7fa;color:#435f71;border-radius:8px;padding:12px 13px;margin:19px 0 15px;line-height:1.65;border-left:3px solid #8fb8c4}.notice strong{color:#273e4c}.actionrow{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}.detailgrid{display:grid;grid-template-columns:100px minmax(0,1fr);row-gap:10px;column-gap:12px;font-size:12px}.detailgrid dt{color:var(--muted)}.detailgrid dd{margin:0;min-width:0;overflow-wrap:anywhere}.pathline{font-family:Consolas,monospace;background:#f5f7f9;border:1px solid var(--border);border-radius:7px;padding:10px 11px;overflow-wrap:anywhere;font-size:12px}.graph{background:#12212d;border-radius:10px;padding:16px;color:#cbdce7;overflow:auto}.graph .flow{min-width:570px;display:flex;align-items:center;gap:7px;justify-content:space-around;margin:10px 0 7px}.node{border:1px solid #6c899d;background:#1c3343;border-radius:7px;min-width:100px;padding:12px 7px;text-align:center;font-size:11px;line-height:1.6}.node.focus{border-color:#71dcdd;background:#17565e;color:white}.edge{color:#72a3b2}.graph small{color:#9fb6c6}.foot{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:16px}.empty{padding:45px 24px;text-align:center;color:var(--muted)}.statspanel{padding:30px;min-height:610px}.bars{display:grid;gap:18px;max-width:620px;margin-top:26px}.barrow{display:grid;grid-template-columns:145px 1fr 60px;gap:14px;align-items:center}.track{height:14px;border-radius:9px;background:#edf3f5;overflow:hidden}.fill{height:100%;background:var(--brand);border-radius:9px}@media(max-width:1150px){.split{grid-template-columns:minmax(0,1fr)}.listpane{border-right:0;border-bottom:1px solid var(--border)}.table-scroll{max-height:340px}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{grid-template-columns:50px 1fr}.rail{padding:12px 3px}.nav{width:40px}.top{padding:0 12px}.topright .muted{display:none}.content{padding:16px 12px}.pagehead{align-items:start}.pagehead h1{font-size:20px}.kpis{gap:9px}.kpi{padding:12px;min-height:108px}.kpi .value{font-size:24px}.filters{padding:12px}.searchwrap{max-width:none}.detail{padding:15px}.head-actions .btn:nth-child(1){display:none}.logo{transform:scale(.8)}}
</style></head><body>
<div class="app"><aside class="rail" aria-label="メインナビゲーション"><div class="logo" title="SHIRANUI"></div><button class="nav" title="プロジェクト"><img class="ico" src="assets/icons/briefcase.svg" alt=""></button><button class="nav" title="実行"><img class="ico" src="assets/icons/activity.svg" alt=""></button><button class="nav" title="統計"><img class="ico" src="assets/icons/chart.svg" alt=""></button><button class="nav active" title="セキュリティアラート"><img class="ico" src="assets/icons/shield.svg" alt=""></button><div class="spacer"></div><button class="nav" title="設定"><img class="ico" src="assets/icons/settings.svg" alt=""></button></aside>
<div class="main"><header class="top"><div class="heading"><strong>SHIRANUI</strong><span class="muted">/</span><small>セキュリティ監視</small><span class="live">監視中</span></div><div class="topright"><span class="muted">最終更新 10:18</span><button class="btn small" onclick="refresh()"><img class="ico" src="assets/icons/refresh.svg" alt="">更新</button></div></header>
<main class="content"><div class="pagehead"><div><div class="eyebrow">プロジェクト / SHIRANUI / アラート</div><h1>アラートの確認と判断</h1></div><div class="head-actions"><button class="btn" onclick="downloadCSV()"><img class="ico" src="assets/icons/download.svg" alt="">CSV出力</button><button class="btn primary" id="queueBtn" onclick="queueSelected()">作業キューに追加</button></div></div>
<section class="kpis" aria-label="主要指標"><button class="kpi" id="kpi-all" onclick="setKpi('all')"><span class="label"><img class="ico" src="assets/icons/activity.svg" alt="">最新200件のアラート</span><span class="value">200<span class="unit">件</span></span><span class="hint">表示対象: 最新フィード</span></button><button class="kpi" id="kpi-pending" onclick="setKpi('pending')"><span class="label"><img class="ico" src="assets/icons/clock.svg" alt="">未対応・未判断</span><span class="value">195<span class="unit">件</span></span><span class="hint">優先して確認</span></button><button class="kpi danger" id="kpi-high" onclick="setKpi('high')"><span class="label"><img class="ico" src="assets/icons/alert-triangle.svg" alt="">高優先度</span><span class="value">1<span class="unit">件</span></span><span class="hint">高・緊急の合計</span></button><button class="kpi" id="kpi-24h" onclick="setKpi('24h')"><span class="label"><img class="ico" src="assets/icons/chart.svg" alt="">直近24時間の検知</span><span class="value">110<span class="unit">件</span></span><span class="hint">期間: ローリング24時間</span></button></section>
<section class="workarea"><div class="tabs"><button class="tab active" id="tab-alerts" onclick="switchTab('alerts')">アラート一覧・判断</button><button class="tab" id="tab-stats" onclick="switchTab('stats')">ログ・統計</button></div><div id="alertView"><div class="filters"><label class="searchwrap"><img class="ico" src="assets/icons/search.svg" alt=""><input id="query" aria-label="アラート検索" placeholder="プロセス・ルール・IDを検索" oninput="render()"></label><select id="severity" aria-label="重要度" onchange="render()"><option value="all">重要度: すべて</option><option value="high">高・緊急</option><option value="med">注意</option><option value="low">低</option></select><select id="status" aria-label="対応状況" onchange="render()"><option value="all">状態: すべて</option><option value="pending">未対応</option><option value="done">対応済み</option></select><select aria-label="期間" id="period" onchange="render()"><option value="all">期間: 全期間</option><option value="24h">直近24時間</option></select><label class="checklabel"><input id="onlyPending" type="checkbox" onchange="render()">未対応のみ</label><span id="count" class="filter-count">200件中 8件をサンプル表示</span><button class="btn small" onclick="clearFilters()">クリア</button></div>
<div class="split"><section class="listpane"><div class="listhead"><strong>検知イベント</strong><span class="muted">行を選択すると詳細を表示</span></div><div class="table-scroll"><table><thead><tr><th>最終検知</th><th>プロセス</th><th>検知ルール</th><th>重要度</th><th>回数</th><th>対応状態</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>該当するアラートがありません。</div></div></section><article class="detail" id="detail" aria-live="polite"></article></div></div><div id="statsView" class="statspanel" hidden><h2>検知ルール別の件数</h2><p class="muted">デモ用サンプルの内訳です。実運用ではバックエンドの統計APIへ接続します。</p><div id="bars" class="bars"></div></div></section>
<div class="foot"><span>表示データ: 参考画面の数値 + 操作デモ用サンプル。リアルタイムデータには接続していません。</span><span>UI Design Concept v1.0</span></div></main></div></div>
<script>
const events=[

{id:2488,time:'11/22 18:06',proc:'MapInspectorCheck.exe',rule:'novel_launch',sev:'low',count:1,status:'pending',score:21,reason:'初めて観測されたプロセス起動です。',path:'C:\\Tools\\MapInspectorCheck.exe'},
{id:2486,time:'11/22 17:42',proc:'pwsh.exe',rule:'script_network',sev:'med',count:3,status:'pending',score:61,reason:'スクリプトからのネットワークアクセスを観測しました。',path:'C:\\Program Files\\PowerShell\\7\\pwsh.exe'},
{id:2484,time:'11/22 17:38',proc:'powershell.exe',rule:'encoded_shell',sev:'med',count:4,status:'pending',score:65,reason:'PowerShellのエンコード指定を観測しました。正規の管理操作でも使われます。',first:'2026/11/22 17:28:36',last:'2026/11/22 17:38:02',path:'C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe'},
{id:2485,time:'11/22 17:35',proc:'ie4uinit.exe',rule:'novel_launch',sev:'low',count:1,status:'pending',score:17,reason:'初回起動を検出しました。',path:'C:\\Windows\\System32\\ie4uinit.exe'},
{id:2483,time:'11/22 17:26',proc:'pwsh.exe',rule:'script_network',sev:'med',count:1,status:'done',score:55,reason:'スクリプトによる通信を検出しました。',path:'C:\\Program Files\\PowerShell\\7\\pwsh.exe'},
{id:2482,time:'11/22 17:25',proc:'DetailCheck.exe',rule:'novel_launch',sev:'low',count:1,status:'pending',score:18,reason:'初回起動を検出しました。',path:'C:\\Tools\\DetailCheck.exe'},
{id:2490,time:'11/22 16:50',proc:'unknown.exe',rule:'suspicious_behavior',sev:'high',count:1,status:'pending',score:91,reason:'複数の不審な挙動が関連して検知されました。確認が必要です。',path:'C:\\Users\\User\\AppData\\Local\\Temp\\unknown.exe'}
];
let selected=2484,kpi='all',queue=[],tab='alerts';const I=n=>`<img class="ico" src="assets/icons/${n}.svg" alt="">`;const label=s=>s==='high'?'高':s==='med'?'注意':'低';const status=s=>s==='pending'?'未対応':'対応済み';const $=id=>document.getElementById(id);function setKpi(v){kpi=v;['all','pending','high','24h'].forEach(x=>$('kpi-'+x).classList.toggle('active',x===v));render()};function clearFilters(){$('query').value='';$('severity').value='all';$('status').value='all';$('period').value='all';$('onlyPending').checked=false;setKpi('all')};function filtered(){let q=$('query').value.trim().toLowerCase();return events.filter(e=>(!q||[e.proc,e.rule,String(e.id)].some(s=>s.toLowerCase().includes(q)))&&($('severity').value==='all'||e.sev===$('severity').value)&&($('status').value==='all'||e.status===$('status').value)&&(!$('onlyPending').checked||e.status==='pending')&&(kpi!=='pending'||e.status==='pending')&&(kpi!=='high'||e.sev==='high'))};function render(){const es=filtered();$('count').textContent=`200件中 ${es.length}件をサンプル表示`;$('rows').innerHTML=es.map(e=>`<tr class="item ${selected===e.id?'selected':''}" tabindex="0" onclick="selectEvent(${e.id})" onkeydown="if(event.key==='Enter')selectEvent(${e.id})"><td>${e.time}</td><td class="proc">${e.proc}</td><td>${e.rule}</td><td><span class="badge ${e.sev}">${label(e.sev)}</span></td><td>${e.count}</td><td><span class="badge ${e.status}">${status(e.status)}</span></td></tr>`).join('');$('empty').hidden=es.length>0;if(!es.some(e=>e.id===selected)&&es.length)selected=es[0].id;renderDetails()};function selectEvent(id){selected=id;render()};function renderDetails(){const e=events.find(x=>x.id===selected);if(!e){$('detail').innerHTML='<p class="muted">アラートを選択してください。</p>';return}const active=filtered().some(x=>x.id===selected);if(!active){$('detail').innerHTML='<p class="muted">左の一覧からアラートを選択してください。</p>';return}$('detail').innerHTML=`<div class="detailtop"><div><div class="eyebrow">検知 ID #${e.id}</div><h2>${e.proc}</h2><div class="detailmeta"><span class="badge ${e.sev}">${label(e.sev)}</span><span class="badge ${e.status}">${status(e.status)}</span><span>検知スコア ${e.score}</span><span>発生 ${e.count} 回</span></div></div><button class="btn small" onclick="copyText('${e.id}')">${I('copy')}IDコピー</button></div><div class="notice"><strong>検知理由</strong><div>${e.reason}</div><div class="muted">この検知のみで悪意があるとは断定できません。実行内容と親プロセスを確認してください。</div></div><div class="actionrow"><button class="btn primary small" onclick="mark('${'done'}')">${I('check-circle')}問題なし</button><button class="btn small" onclick="mark('pending')">${I('help-circle')}要確認</button><button class="btn small" onclick="addToQueue(${e.id})">${I('briefcase')}作業キューへ</button></div><h3>検知情報</h3><dl class="detailgrid"><dt>検知ルール</dt><dd>${e.rule}</dd><dt>最終検知</dt><dd>2026/${e.time.replace(' ',' ')}</dd><dt>初回検知</dt><dd>${e.first||'未取得（デモ）'}</dd><dt>対応状況</dt><dd>${status(e.status)}</dd></dl><h3>実行ファイル</h3><div class="pathline">${e.path}</div><div class="actionrow"><button class="btn small" onclick="copyText(${JSON.stringify(e.path).replace(/"/g,'&quot;')})">${I('copy')}パスをコピー</button></div><h3>プロセス起動経路</h3><div class="graph"><small>実際の親子関係はバックエンドから取得して表示します（以下は模式図）。</small><div class="flow"><div class="node">記録外</div><span class="edge">→</span><div class="node">userinit.exe</div><span class="edge">→</span><div class="node">explorer.exe</div><span class="edge">→</span><div class="node focus">${e.proc}</div></div></div>`};function mark(st){const e=events.find(x=>x.id===selected);e.status=st;render();toast(st==='done'?'「問題なし」に変更しました（デモ）':'「要確認」に設定しました（デモ）')};function addToQueue(id){if(!queue.includes(id))queue.push(id);toast('ID #'+id+' を作業キューに追加（デモ）')};function queueSelected(){addToQueue(selected)};function toast(msg){let b=$('toast');if(!b){b=document.createElement('div');b.id='toast';b.setAttribute('role','status');b.style='position:fixed;bottom:20px;right:20px;background:#152e37;color:white;padding:13px 18px;border-radius:9px;box-shadow:0 8px 30px #0003;z-index:5';document.body.append(b)}b.textContent=msg;clearTimeout(window.tid);window.tid=setTimeout(()=>b.remove(),2500)};function copyText(s){navigator.clipboard?.writeText(String(s)).then(()=>toast('コピーしました')).catch(()=>toast('コピー機能はHTTPSまたはlocalhostで使用できます'))};function refresh(){toast('UIデモのため、サーバーからは更新しません')};function switchTab(t){tab=t;$('alertView').hidden=t!=='alerts';$('statsView').hidden=t!=='stats';$('tab-alerts').classList.toggle('active',t==='alerts');$('tab-stats').classList.toggle('active',t==='stats');if(t==='stats')renderBars()};function renderBars(){const groups={};events.forEach(e=>groups[e.rule]=(groups[e.rule]||0)+e.count);let max=Math.max(...Object.values(groups));$('bars').innerHTML=Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([name,n])=>`<div class="barrow"><strong>${name}</strong><div class="track"><div class="fill" style="width:${100*n/max}%"></div></div><span>${n} 件</span></div>`).join('')};function downloadCSV(){const rows=[['ID','最終検知','プロセス','検知ルール','重要度','発生回数','対応状況'],...filtered().map(e=>[e.id,e.time,e.proc,e.rule,label(e.sev),e.count,status(e.status)])];const csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='shiranui-alerts-demo.csv';a.click();URL.revokeObjectURL(url)};render();
</script></body></html>
